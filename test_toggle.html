<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Toggle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .folder-content {
            transition: all 0.3s ease;
        }
        .folder-content.collapsed {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container mt-3">
        <h2>Test Toggle Cartelle</h2>
        
        <!-- Test Cartella 1 -->
        <div class="card mb-3 folder-card" data-folder-id="1">
            <div class="card-header">
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-link p-0 me-2 folder-toggle" data-folder-id="1">
                        <i class="bi bi-chevron-down"></i>
                    </button>
                    <i class="bi bi-folder-fill me-2" style="color: #007bff;"></i>
                    <h5 class="mb-0">Test Cartella 1 (2 prove)</h5>
                </div>
            </div>
            
            <div class="card-body folder-content" id="folder-1">
                <p>Contenuto della cartella 1</p>
                <ul>
                    <li>Prova 1</li>
                    <li>Prova 2</li>
                </ul>
            </div>
        </div>
        
        <!-- Test Cartella 2 -->
        <div class="card mb-3 folder-card" data-folder-id="2">
            <div class="card-header">
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-link p-0 me-2 folder-toggle" data-folder-id="2">
                        <i class="bi bi-chevron-down"></i>
                    </button>
                    <i class="bi bi-folder-fill me-2" style="color: #28a745;"></i>
                    <h5 class="mb-0">Test Cartella 2 (1 prova)</h5>
                </div>
            </div>
            
            <div class="card-body folder-content" id="folder-2">
                <p>Contenuto della cartella 2</p>
                <ul>
                    <li>Prova 3</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, initializing folder functionality...');
        
        const toggleButtons = document.querySelectorAll('.folder-toggle');
        console.log('Found toggle buttons:', toggleButtons.length);
        
        toggleButtons.forEach(button => {
            console.log('Setting up button for folder:', button.getAttribute('data-folder-id'));
            
            button.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const folderId = this.getAttribute('data-folder-id');
                const folderContent = document.getElementById('folder-' + folderId);
                const icon = this.querySelector('i');
                
                console.log('Toggle clicked for folder:', folderId, 'Element found:', !!folderContent);
                
                if (!folderContent) {
                    console.error('Folder content not found for ID:', folderId);
                    return;
                }
                
                if (folderContent.classList.contains('collapsed')) {
                    folderContent.classList.remove('collapsed');
                    folderContent.style.display = 'block';
                    icon.className = 'bi bi-chevron-down';
                    console.log('Expanded folder:', folderId);
                } else {
                    folderContent.classList.add('collapsed');
                    folderContent.style.display = 'none';
                    icon.className = 'bi bi-chevron-right';
                    console.log('Collapsed folder:', folderId);
                }
            });
        });
    });
    </script>
</body>
</html>
